version: "3.8"
 
services:
  rabbitmq:
    image: rabbitmq:3.11-management
    ports:
      - "5672:5672" # AMQP protocol
      - "15672:15672" # RabbitMQ Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
 
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
 
  api-gateway:
    build: ./api-gateway
    ports:
      - "4000:4000"
    environment:
      USER_DB: mongodb://mongo:27017/Userdatabase
      ORDER_DB: mongodb://mongo:27017/ordersdb
      PAYMENT_DB: mongodb://mongo:27017/paymentsdb
      JWT_SECRET: supersecretkey
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      - mongo
      - rabbitmq
 
  user-service:
    build: ./user-service
    ports:
      - "4001:4001"
    environment:
      MONGO_URI: mongodb://mongo:27017/Userdatabase
      JWT_SECRET: supersecretkey
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      - mongo
      - rabbitmq
 
  order-service:
    build: ./order-service
    ports:
      - "4002:4002"
    environment:
      MONGO_URI: mongodb://mongo:27017/ordersdb
      JWT_SECRET: supersecretkey
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      - mongo
      - rabbitmq
 
  payment-service:
    build: ./payment-service
    ports:
      - "4003:4003"
    environment:
      MONGO_URI: mongodb://mongo:27017/paymentsdb
      JWT_SECRET: supersecretkey
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      - mongo
      - rabbitmq
 
volumes:
  mongo-data:
 
 